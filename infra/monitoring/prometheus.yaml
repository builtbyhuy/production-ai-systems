global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/rules.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: pais-api
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/scrape_token
    static_configs:
      - targets: [host.docker.internal:8000]
