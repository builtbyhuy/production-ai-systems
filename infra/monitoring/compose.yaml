name: pais-observability
services:
  prometheus:
    image: prom/prometheus:v3.4.2
    command: [--config.file=/etc/prometheus/prometheus.yaml, --storage.tsdb.retention.time=48h]
    ports: [127.0.0.1:9090:9090]
    extra_hosts: [host.docker.internal:host-gateway]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./rules.yaml:/etc/prometheus/rules.yaml:ro
      - ./fixtures/scrape-token:/run/secrets/scrape_token:ro
      - prometheus:/prometheus
    mem_limit: 512m
    cpus: 1
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: [--config.file=/etc/alertmanager/alertmanager.yaml, --cluster.listen-address=]
    ports: [127.0.0.1:9093:9093]
    volumes: [./alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro]
    mem_limit: 128m
    cpus: 0.5
  alert-sink:
    image: python:3.12.11-slim
    command: [python, /app/alert_sink.py, --host, 0.0.0.0, --output, /data/alerts.jsonl]
    ports: [127.0.0.1:8089:8089]
    volumes:
      - ./alert_sink.py:/app/alert_sink.py:ro
      - alerts:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
  tempo:
    image: grafana/tempo:2.8.0
    command: [-config.file=/etc/tempo/tempo.yaml]
    ports: [127.0.0.1:3200:3200]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo:/var/tempo
    mem_limit: 512m
    cpus: 1
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.126.0
    command: [--config=/etc/otel/collector.yaml]
    ports: [127.0.0.1:4318:4318]
    volumes: [./collector.yaml:/etc/otel/collector.yaml:ro]
    mem_limit: 256m
    cpus: 0.5
  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${PAIS_GRAFANA_PASSWORD:?Set a local Grafana password}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: [127.0.0.1:3001:3000]
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    mem_limit: 512m
    cpus: 1
volumes:
  prometheus: {}
  alerts: {}
  tempo: {}
  grafana: {}
