global:
  resolve_timeout: 1m
route:
  receiver: local-test-destination
  group_by: [alertname, release]
  group_wait: 5s
  group_interval: 5s
  repeat_interval: 5m
receivers:
  - name: local-test-destination
    webhook_configs:
      - url: http://alert-sink:8089/alerts
        send_resolved: true
