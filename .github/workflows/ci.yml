name: Contract and supply-chain checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
      - name: Native Redis for mandatory broker and memory recovery tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends redis-server
          redis-server --version
      - run: uv sync --frozen --group dev --extra router --extra workflows --extra vectors
      - run: uv run --no-sync ruff check packages services tests projects scripts infra
      - run: uv run --no-sync mypy packages/pais/contracts.py packages/pais/operations.py
      - name: Required contract tests; real-model release gate is separate
        run: uv run --no-sync pytest tests projects/13-agent-memory/test_comparison.py projects/14-inference-server/test_supervisor.py -m 'not local and not connected and not deployment'
      - name: Frozen isolated real-framework tests
        run: |
          uv sync --frozen --project projects/03-multi-agent-research
          uv sync --frozen --project projects/06-security-guardrails --group dev
          PYTHONPATH="$GITHUB_WORKSPACE/packages:$GITHUB_WORKSPACE" projects/03-multi-agent-research/.venv/bin/python -m pytest projects/03-multi-agent-research/test_crewai.py -q
          PYTHONPATH="$GITHUB_WORKSPACE/packages:$GITHUB_WORKSPACE" projects/06-security-guardrails/.venv/bin/python -m pytest projects/06-security-guardrails/test_guardrails_real.py -q
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # verified v6 ref
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/copilot/package-lock.json
      - name: UI install, type check and production build
        working-directory: apps/copilot
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Actual browser contract tests on fixture model profile
        run: uv run --no-sync python projects/08-streaming-ui/run_browser_tests.py --profile fixture
      - name: Dependencies and secrets; scanning failure blocks CI
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          skip-dirs: .venv,artifacts,node_modules
