# Both images and all models must already exist. No runtime image/model pulls.
services:
  api:
    environment:
      PAIS_OLLAMA_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
  ollama:
    image: ${PAIS_OLLAMA_IMAGE:?Set the preloaded official Ollama immutable image reference}
    pull_policy: never
    command: [serve]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "0"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      no_proxy: ""
    volumes:
      - ollama_state:/root/.ollama
      - type: bind
        source: ${PAIS_MODELS_DIR:?Set the absolute provisioned models directory}/ollama
        target: /models
        read_only: true
        bind:
          create_host_path: false
    networks: [local]
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 4
volumes:
  ollama_state:
networks:
  local:
    internal: true
